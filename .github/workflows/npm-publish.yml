name: Publish to npm (debug)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（如 0.2.0）
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # 故意不设 registry-url：避开 setup-node 注入的占位 NODE_AUTH_TOKEN

      - name: 检查 OIDC 环境并打印 claims
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL 不存在，id-token: write 未生效"
            exit 1
          fi
          echo "OIDC env: OK"
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::无法获取 OIDC token"; exit 1
          fi
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null \
            | jq '{repository, job_workflow_ref, ref, environment, repository_visibility}'

      - name: 打印 npm 环境
        run: |
          npm install -g npm@latest
          npm --version
          npm config get registry
          npm config list

      - name: 尝试发布（verbose）
        run: npm stage publish --access public --loglevel verbose
